<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #667085; --line: #e3e6eb;
    --accent: #2457d6; --good: #1a7f4b; --warn: #b26a00; --bad: #b42318; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --card: #1a1f28; --ink: #e8ebf0; --muted: #98a2b3; --line: #2b3240;
            --accent: #7aa2ff; --good: #55c58a; --warn: #f0b24a; --bad: #ff8a80; --chip: #252c38; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 24px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.small { padding: 3px 8px; font-size: 12px; }
  select, input, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; max-width: 100%; }
  textarea { width: 100%; min-height: 54px; resize: vertical; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
  td.role a { color: var(--accent); font-weight: 600; text-decoration: none; }
  td.role small { display: block; color: var(--muted); }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .chip.due { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .chip.good { color: var(--good); border: 1px solid var(--good); background: transparent; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-top: 16px; }
  ul.plain { margin: 0; padding-left: 18px; }
  ul.plain li { margin: 4px 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  form.add { display: none; margin-bottom: 12px; }
  form.add.show { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  form.add label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
  td input[type=date] { width: 132px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Job Search Tracker</h1>
    <span class="muted" id="today"></span>
  </header>

  <section class="kpis" id="kpis"></section>

  <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
    <div class="tabs" id="tabs"></div>
    <div class="row">
      <button id="addBtn">+ Add application</button>
      <button id="csvBtn">Export CSV</button>
    </div>
  </div>

  <form class="add card" id="addForm">
    <label>Company<input name="company" required></label>
    <label>Role<input name="role" required></label>
    <label>Posting link<input name="url" placeholder="https://..."></label>
    <label>Source<input name="source" placeholder="company feed, Indeed, referral..."></label>
    <label>Status<select name="status" id="addStatus"></select></label>
    <label>Work model<input name="model" placeholder="remote, hybrid, on-site..."></label>
    <div class="row" style="align-items: end;"><button type="submit" class="on">Save</button></div>
  </form>

  <div class="tablewrap"><table id="table"></table></div>

  <div class="grid2">
    <section class="card">
      <h2>What the data says</h2>
      <ul class="plain" id="hints"></ul>
      <h2 style="margin-top: 14px;">Outreach effect</h2>
      <table id="byOutreach"></table>
      <h2 style="margin-top: 14px;">By source</h2>
      <table id="bySource"></table>
      <h2 style="margin-top: 14px;">By work model</h2>
      <table id="byModel"></table>
    </section>
    <section class="card">
      <h2>Lessons (self-learning log)</h2>
      <p class="muted" style="margin-top: 0;">Write what worked or failed. The search rules in <code>.claude/memory/target-roles.md</code> are tuned from this.</p>
      <div class="row"><input id="lessonText" style="flex: 1; min-width: 200px;" placeholder="e.g. Recruiter replied within 2 days when I messaged first"><button id="lessonBtn">Add</button></div>
      <ul class="plain" id="lessons" style="margin-top: 10px;"></ul>
    </section>
  </div>
</main>

<script>
const H = { "Content-Type": "application/json", "X-Requested-With": "job-dashboard" };
let S = { data: { applications: [], lessons: [] }, insights: {}, statuses: [], replies: [], today: "" };
let tab = "waiting";

const TABS = [
  ["toapply", "To apply", a => a.status === "drafted"],
  ["waiting", "Waiting for a reply", a => a.status === "applied" && a.reply === "none"],
  ["replies", "Replies and interviews", a => ["interview", "offer"].includes(a.status) || ["recruiter", "interview", "offer", "auto", "rejection"].includes(a.reply) && !["rejected", "closed", "withdrawn"].includes(a.status)],
  ["closed", "Closed / archived", a => ["rejected", "closed", "withdrawn"].includes(a.status)],
  ["all", "All", () => true],
];

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: H, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (j.data) { S.data = j.data; S.insights = j.insights; }
  return j;
}
async function load() { const j = await (await fetch("/api/data")).json(); S = j; render(); }
async function save(rec) { await api("/api/save", { record: rec }); render(); }

const daysSince = d => d ? Math.floor((new Date(S.today) - new Date(d)) / 86400000) : null;

function select(options, value, onchange) {
  const s = h("select", { onchange: e => onchange(e.target.value) }, options.map(o => h("option", { value: o, selected: o === value }, o)));
  return s;
}

function render() {
  document.getElementById("today").textContent = "Today " + S.today;
  const i = S.insights || {};
  const k = (label, val, sub) => h("div", { class: "card kpi" }, h("span", { class: "muted" }, label), h("b", {}, val ?? "-"), h("span", { class: "muted" }, sub || ""));
  const kp = document.getElementById("kpis"); kp.replaceChildren(
    k("Applied", i.applied, `${(i.by_status || {}).drafted || 0} drafted, not sent`),
    k("Waiting", S.data.applications.filter(a => a.status === "applied" && a.reply === "none").length, "no reply yet"),
    k("Real replies", i.real_replies, "recruiter, interview or offer"),
    k("Reply rate", i.reply_rate == null ? "-" : i.reply_rate + "%", i.applied < 10 ? "small sample" : ""),
    k("Interviews", i.interviews, ""),
    k("Follow-ups due", (i.follow_ups_due || []).length, "7+ days, no reply"),
  );

  const tb = document.getElementById("tabs"); tb.replaceChildren(...TABS.map(([id, label, f]) =>
    h("button", { class: id === tab ? "on" : "", onclick: () => { tab = id; render(); } }, `${label} (${S.data.applications.filter(f).length})`)));

  const f = TABS.find(t => t[0] === tab)[2];
  const rows = S.data.applications.filter(f).sort((a, b) => (b.applied || b.found || "").localeCompare(a.applied || a.found || ""));
  const table = document.getElementById("table");
  if (!rows.length) { table.replaceChildren(h("tbody", {}, h("tr", {}, h("td", { class: "empty" }, "Nothing here yet.")))); }
  else table.replaceChildren(
    h("thead", {}, h("tr", {}, ["Role", "Status", "Contacted back?", "Dates", "Outreach, notes, contact", ""].map(t => h("th", {}, t)))),
    h("tbody", {}, rows.map(rowFor)));

  const bs = (el, obj) => el.replaceChildren(h("tbody", {}, Object.entries(obj || {}).map(([n, v]) =>
    h("tr", {}, h("td", {}, n), h("td", {}, `${v.applied} applied`), h("td", {}, `${v.replies} replies`)))));
  bs(document.getElementById("byOutreach"), { "messaged someone": (i.outreach || {}).sent, "no message": (i.outreach || {}).not_sent });
  bs(document.getElementById("bySource"), i.by_source); bs(document.getElementById("byModel"), i.by_model);
  document.getElementById("hints").replaceChildren(...(i.hints || []).map(t => h("li", {}, t)));
  document.getElementById("lessons").replaceChildren(...S.data.lessons.map((l, n) =>
    h("li", {}, h("span", { class: "muted" }, l.date + "  "), l.text + " ", h("button", { class: "small", onclick: async () => { await api("/api/lesson", { delete: n }); render(); } }, "x"))));
  document.getElementById("addStatus").replaceChildren(...S.statuses.map(s => h("option", { value: s }, s)));
}

function rowFor(a) {
  const due = (S.insights.follow_ups_due || []).find(x => x.id === a.id);
  const age = daysSince(a.applied);
  const archived = (a.folder || "").includes("_archive");
  const notes = h("textarea", { onblur: e => { if (e.target.value !== (a.notes || "")) { a.notes = e.target.value; save({ id: a.id, notes: a.notes }); } } }, a.notes || "");
  const contact = h("input", { value: a.contact || "", placeholder: "who replied / recruiter", onchange: e => { a.contact = e.target.value; save({ id: a.id, contact: a.contact }); } });
  return h("tr", {},
    h("td", { class: "role" }, a.url ? h("a", { href: a.url, target: "_blank", rel: "noopener" }, a.company + ": " + a.role) : a.company + ": " + a.role,
      h("small", {}, [a.source, a.model, a.fit && "fit: " + a.fit].filter(Boolean).join("  ·  "))),
    h("td", {}, select(S.statuses, a.status, v => { a.status = v; save({ id: a.id, status: v, applied: a.applied || null }).then(load); })),
    h("td", {}, select(S.replies, a.reply, v => { a.reply = v; save({ id: a.id, reply: v }).then(load); }),
      due ? h("div", {}, h("span", { class: "chip due" }, `follow up (${due.days}d)`)) : null,
      a.reply === "recruiter" || a.reply === "interview" || a.reply === "offer" ? h("div", {}, h("span", { class: "chip good" }, "replied " + (a.reply_date || ""))) : null),
    h("td", {}, h("div", { class: "muted" }, "Applied"), h("input", { type: "date", value: a.applied || "", onchange: e => save({ id: a.id, applied: e.target.value }).then(load) }),
      age != null && a.status === "applied" ? h("div", { class: "muted" }, age + " days ago") : null,
      h("div", { class: "muted" }, "Reply"), h("input", { type: "date", value: a.reply_date || "", onchange: e => save({ id: a.id, reply_date: e.target.value }) })),
    h("td", {}, h("div", { class: "muted" }, "Outreach to recruiter / hiring manager"),
      select(S.outreach || ["none"], a.outreach || "none", v => { a.outreach = v; save({ id: a.id, outreach: v }); }),
      a.outreach_contacts ? h("div", { class: "muted" }, a.outreach_contacts) : null, notes, contact),
    h("td", {}, h("div", { class: "muted", style: "font-size:12px" }, a.folder || "no folder"),
      a.folder ? h("button", { class: "small", onclick: async () => { const r = await api("/api/archive", { id: a.id, archive: !archived }); alert(r.message); render(); } }, archived ? "Unarchive" : "Archive") : null,
      " ", h("button", { class: "small", onclick: async () => { if (confirm("Remove this entry from the tracker? Files are not deleted.")) { await api("/api/delete", { id: a.id }); render(); } } }, "Remove")));
}

document.getElementById("addBtn").onclick = () => document.getElementById("addForm").classList.toggle("show");
document.getElementById("addForm").onsubmit = async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target).entries());
  f.id = new Date().toISOString().slice(0, 10) + "_" + (f.company + "_" + f.role).toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 50);
  await save(f); e.target.reset(); e.target.classList.remove("show");
};
document.getElementById("lessonBtn").onclick = async () => {
  const t = document.getElementById("lessonText"); if (!t.value.trim()) return;
  await api("/api/lesson", { text: t.value.trim() }); t.value = ""; render();
};
document.getElementById("csvBtn").onclick = () => {
  const cols = ["company", "role", "status", "reply", "applied", "reply_date", "source", "model", "url", "contact", "notes"];
  const esc = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const csv = [cols.join(","), ...S.data.applications.map(a => cols.map(c => esc(a[c])).join(","))].join("\n");
  const link = h("a", { href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })), download: "applications.csv" }); link.click();
};
load();
</script>
</body>
</html>
